    <script>
      // Prevent theme flash: resolve theme before paint.
      (function () {
        try {
          var stored = localStorage.getItem('nl-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'lumos' : 'nox');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'nox');
        }
      })();
    </script>
